name: CI
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: '.nvmrc', cache: npm }
      - run: npm ci
      - run: npx prettier --check .
      - run: npx eslint .
      - run: npm run check
      # The vitest "client" project runs component tests in real Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit -- --run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: '.nvmrc', cache: npm }
      - run: npm ci
      - run: npm run build
      # A prerendered sitemap/robots bakes url.origin at build time. Without
      # kit.prerender.origin that is the placeholder host, which would ship
      # crawler files pointing at a domain that does not exist.
      - name: Prerendered output must not contain the placeholder origin
        run: |
          if grep -rq "sveltekit-prerender" .svelte-kit/output/prerendered; then
            echo "::error::Prerendered output contains the placeholder origin"
            grep -rn "sveltekit-prerender" .svelte-kit/output/prerendered | head
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    # Runs inside the SAME image scripts/snapshots.sh generates baselines in, and the tag must be
    # kept in step with the installed @playwright/test version. Font rasterisation differs between
    # this image and a bare ubuntu-latest runner, so a baseline produced in one does not match a
    # screenshot taken in the other — the visual spec failed on exactly that before this changed.
    # Browsers are preinstalled here, so there is no install step and no --with-deps.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Chromium needs a real /dev/shm; the default 64 MB causes tab crashes under load.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      # The image ships its own Node, which is not the version .nvmrc pins. Pinning here keeps
      # every job on one Node while still inheriting the image's browsers and fonts.
      - uses: actions/setup-node@v5
        with: { node-version-file: '.nvmrc' }
      - run: npm ci
      # Not `npm run test:e2e` — that script reinstalls browsers the image already has.
      - run: npx playwright test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: '.nvmrc', cache: npm }
      - run: npm ci
      # lighthouserc.cjs points Chrome at Playwright's browser rather than pulling in puppeteer
      # and a second Chromium, so this download is what makes the Lighthouse job runnable.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run size
      - run: npx lhci autorun --config=./lighthouserc.cjs
