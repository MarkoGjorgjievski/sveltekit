name: CI
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: '.nvmrc', cache: npm }
      - run: npm ci
      - run: npx prettier --check .
      - run: npx eslint .
      - run: npm run check
      # The vitest "client" project runs component tests in real Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit -- --run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: '.nvmrc', cache: npm }
      - run: npm ci
      - run: npm run build
      # A prerendered sitemap/robots bakes url.origin at build time. Without
      # kit.prerender.origin that is the placeholder host, which would ship
      # crawler files pointing at a domain that does not exist.
      - name: Prerendered output must not contain the placeholder origin
        run: |
          if grep -rq "sveltekit-prerender" .svelte-kit/output/prerendered; then
            echo "::error::Prerendered output contains the placeholder origin"
            grep -rn "sveltekit-prerender" .svelte-kit/output/prerendered | head
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: '.nvmrc', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Not `npm run test:e2e` — that script reinstalls browsers, which the step above
      # already did with the system dependencies CI needs.
      - run: npx playwright test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
